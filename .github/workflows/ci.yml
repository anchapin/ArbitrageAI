name: AI Platform CI

on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Dependency vulnerability scanning with pip-audit
      - name: Install pip-audit
        run: pip install pip-audit

      - name: Security scan dependencies (pip-audit)
        run: |
          pip-audit -r pyproject.toml || true  # Non-blocking initially

      # Backup dependency scanning with Safety
      - name: Install safety
        run: pip install safety

      - name: Safety check
        run: |
          safety check -r pyproject.toml --full-report || true

      # Python SAST with Bandit
      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      # Upload bandit report as artifact
      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      # Secret detection with Gitleaks
      - name: Run gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Run Linter (Ruff)
        run: ruff check .
  
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          pip install -e .[tests] 2>/dev/null || pip install -e .
          pip install pytest pytest-asyncio pytest-cov pytest-timeout pytest-xdist
          
      - name: Run Unit Tests (Shard ${{ matrix.shard }})
        run: |
          pytest tests/ --ignore=tests/e2e/ -v --cov=src --cov-report=xml --cov-report=term:skip-covered --timeout=300 --cov-config=pyproject.toml --cov-fail-under=80
        env:
          PYTHONUNBUFFERED: 1
          DISABLE_RATE_LIMITING: true
        
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          pip install -e .[tests] 2>/dev/null || pip install -e .
          pip install pytest pytest-asyncio pytest-timeout
          
      - name: Run E2E Tests
        run: |
          pytest tests/e2e/ -v --tb=short --timeout=300
        env:
          PYTHONUNBUFFERED: 1
          DISABLE_RATE_LIMITING: true
