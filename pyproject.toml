[project]
name = "arbitrage-ai"
version = "0.1.0"
description = "ArbitrageAI Backend"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "stripe>=7.0.0",
    "openai>=1.0.0",
    "e2b-code-interpreter>=1.0.0",
    "python-dotenv>=1.0.0",
    # File parsing dependencies
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "PyPDF2>=3.0.0",
    "python-multipart>=0.0.6",
    # Experience Vector Database (RAG for Few-Shot Learning)
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    # Observability and Tracing
    "traceloop-sdk>=0.15.0",
    "arize-phoenix>=4.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    # APM and distributed tracing (Issue #42)
    "opentelemetry-exporter-prometheus>=0.45b0",
    "numpy>=1.24.0",
    # Error Tracking (Issue #230)
    "sentry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-grpc>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-requests>=0.45b0",
    "prometheus-client>=0.19.0",
    # Docker Sandbox (replaces E2B for cost savings)
    "docker>=7.0.0",
    # Market Scanner (Playwright for web scraping)
    "playwright>=1.40.0",
    # Distributed Locking and Caching (Issue #19)
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "croniter>=2.0.0",
    "PyJWT>=2.8.0",
    "boto3>=1.34.0",
    "schedule>=1.2.0",
    "ruff",
    # Database migrations (QAQC-008)
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
    "pre-commit>=3.6.0",
    "mypy>=1.8.0",
    "vulture>=2.0.0",
    "flake8>=7.0.0",
    "pylint>=3.0.0",
    "detect-secrets>=1.4.0",
]
tests = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.0.0",
    "aiofiles>=23.0.0",
    "python-docx>=1.2.0",
]

[project.scripts]
ft-cli = "fine_tuning.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Exclude specific directories
exclude = [
    ".agents/",
    ".git/",
    ".github/",  # CODEOWNERS and other GitHub config files
    ".venv/",
    "venv/",
    "__pycache__/",
    "node_modules/",
    "src/client_portal/node_modules/",
    "*.egg-info/",
    ".eggs/",
    "dist/",
    "build/",
    # Migrations are auto-generated and don't need linting
    "alembic/versions/",
    "alembic/env.py",
    # Tests have their own rules
    "tests/",
    # Scripts can have relaxed rules
    "scripts/",
    # Temporary/refactor files
    "refactor_models.py",
    # Legacy compatibility file (not used, kept for reference)
    "src/api/main_original.py",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enable comprehensive linting rules for maximum code consistency
select = [
    # Core linting
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    
    # Bug prevention
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie (additional bugbear rules)
    "RUF",    # Ruff-specific rules
    
    # Code quality & style
    "N",      # pep8-naming
    "Q",      # flake8-quotes
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "COM",    # flake8-commas (trailing commas)
    "PYI",    # flake8-pyi (type stub files)
    
    # Modernization
    "UP",     # pyupgrade (Python version upgrades)
    "PERF",   # flake8-perflint (performance anti-patterns)
    
    # Async & concurrency
    "ASYNC",  # flake8-async
    
    # Type checking
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "FA",     # flake8-future-annotations
    
    # Pathlib & modernization
    "PTH",    # flake8-use-pathlib
    
    # Code cleanliness
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "ISC",    # flake8-implicit-str-concat
    "INP",    # flake8-no-pep420 (implicit namespace packages)
    "TID",    # flake8-tidy-imports
    "ICN",    # flake8-import-conventions
    
    # Security
    "S",      # flake8-bandit (security)
    "DJ",     # flake8-django (security patterns)
    
    # Datetime safety
    "DTZ",    # flake8-datetimez (datetime safety)
    
    # Documentation (handled by per-file-ignores for specific files)
    # D rules are enabled but most files are ignored in per-file-ignores
    
    # Explicitly include important rules
    "E722",   # bare-except
]

# Ignore rules that require significant refactoring (tracked in QAQC-007)
# These will be fixed in follow-up PRs as part of continuous improvement
ignore = [
    # Formatting rules (handled by ruff format)
    "E501",     # line too long (handled by formatter)
    "W191",     # indentation contains tab
    "E111",     # indentation with invalid multiple
    "E114",     # indentation is over-indented
    "E117",     # over-indented

    # Pylint rules that are too strict
    "PLR0913",  # Too many arguments in function definition
    "PLR2004",  # Magic value used in comparison
    "PLR0912",  # Too many branches (handled by mccabe)
    "PLR0915",  # Too many statements (handled by mccabe)

    # Pathlib rules that are too aggressive
    "PTH123",   # `open()` should be replaced by `Path.open()`

    # Test-related exclusions (handled in per-file-ignores)
    "S101",     # assert statements (allowed in tests)

    # Datetime safety for logging
    "DTZ005",   # datetime.now() without tz (acceptable for logs)

    # Docstring rules that are too strict
    "D100",     # Missing docstring in public module
    "D104",     # Missing docstring in public package
    "D105",     # Missing docstring in magic method
    "D203",     # 1 blank line required before class docstring (conflicts with D211)
    "D212",     # Multi-line docstring summary should start at first line (use D213 instead)

    # Import rules that conflict with project structure
    "INP001",   # File is part of an implicit namespace package
    
    # Code quality rules tracked in QAQC-007 for future refactoring
    "PLR6301",  # no-self-use (143 violations - requires converting to static/class methods)
    "ARG001",   # unused-function-argument (20 violations)
    "ARG002",   # unused-method-argument (34 violations)
    "ARG004",   # unused-static-method-argument (24 violations - from @staticmethod conversions)
    "PERF203",  # try-except-in-loop (23 violations - intentional retry patterns)
    "PLR1702",  # too-many-nested-blocks (13 violations)
    "N806",     # non-lowercase-variable-in-function (10 violations)
    "PLR0917",  # too-many-positional-arguments (9 violations)
    "RUF029",   # unused-async (22 violations)
    "ASYNC230", # blocking-open-call-in-async-function (6 violations)
    "PLW1514",  # unspecified-encoding (4 violations)
    "RUF002",   # ambiguous-unicode-character-docstring (4 violations)
    "RUF003",   # ambiguous-unicode-character-comment (4 violations)
    "ERA001",   # commented-out code (2 violations)
    "PLC2801",  # unnecessary-dunder-call (3 violations)
    "PLR0911",  # too-many-return-statements (3 violations)
    "RUF022",   # unsorted-dunder-all (3 violations)
    "PLR0904",  # too-many-public-methods (2 violations)
    "PLW0602",  # global-variable-not-assigned (2 violations)
    "PLW1508",  # invalid-envvar-default (4 violations)
    "RUF001",   # ambiguous-unicode-character-string (2 violations)
    "RUF012",   # mutable-class-default (3 violations)
    "ASYNC110", # async-busy-wait (1 violation)
    "RUF067",   # non-empty-init (pre-existing registry pattern)
    "PYI034",   # __new__ return type (singleton pattern)
    "B027",     # empty-method-without-abstract-decorator (1 violation)
    "N815",     # mixed-case-variable-in-class-scope (1 violation)
    "PLR0914",  # too-many-locals (1 violation)
    "PLR6201",  # literal-membership (1 violation)
    "RUF006",   # asyncio-dangling-task (1 violation)
    "RUF045",   # implicit-class-var-in-dataclass (1 violation)
    "I001",     # unsorted-imports (requires manual sorting)
    "PTH",      # pathlib rules (requires refactoring)
    "UP015",    # redundant-open-modes
    "ARG005",   # unused-lambda-argument
    "SIM102",   # collapsible-if
    "SIM117",   # multiple-with-statements
    "PLW0603",  # global-statement (singleton pattern)
    "RUF100",   # unused-noqa (noqa comments that are now unnecessary)
    "E116",     # unexpected-indentation-comment
]

# Allow autofix for specific rules
fixable = ["ALL"]
unfixable = [
    "ERA",  # Don't auto-remove commented-out code (may be intentional)
]

# Preview mode for latest rules
preview = true

# Per-file-ignores
[tool.ruff.lint.per-file-ignores]
# Tests can have magic values and assertions
"tests/**/*.py" = [
    "PLR2004",  # Magic values
    "S101",     # assert statements
    "ARG",      # Unused arguments (fixtures)
    "DTZ",      # Datetime rules (test data)
    "S105",     # Hardcoded passwords (test data)
    "S106",     # Hardcoded passwords (test data)
    "S110",     # try-except-pass (test error handling)
    "B017",     # assert-raises-exception (test patterns)
    "B011",     # assert-false (test patterns)
    "D",        # Docstring requirements
    "N806",     # Non-lowercase variable names (test data)
    "PERF",     # Performance rules (test data)
    "INP001",   # Implicit namespace package
]
# Fine-tuning CLI can have simple code
"src/fine_tuning/**/*.py" = ["T201"]
# Ignore commented-out code in config files
"pyproject.toml" = ["ALL"]
# __init__.py files can have unused imports and lazy imports (for re-exporting and circular dependency avoidance)
"**/__init__.py" = ["F401", "F403", "D104", "PLC0415", "PLR6301", "RUF067"]
# Conftest can have unused fixtures and imports
"**/conftest.py" = ["F401", "F403", "ARG", "D100", "D103"]
# Scripts can use print statements
"scripts/**/*.py" = ["T201", "INP001"]
# Migrations can have magic values and raw SQL
"**/migrations/**/*.py" = ["PLR2004", "S608", "D100"]
# Examples and demos can have relaxed rules
"examples/**/*.py" = ["D100", "D103", "PLR2004", "S101"]
# Disaster recovery modules use blocking I/O intentionally (not performance critical)
"src/disaster_recovery/**/*.py" = ["ASYNC230", "ASYNC240"]
# Graceful shutdown uses asyncio.sleep loop intentionally
"src/utils/graceful_shutdown.py" = ["ASYNC110"]
# E501: Line length violations in various modules (mostly LLM prompts, docstrings, complex expressions)
"src/agent_execution/market_scanner.py" = ["E501"]
"src/agent_execution/document_gen.py" = ["E501", "PLC0415", "D107", "SIM102"]
"src/market_scanner/scanner.py" = ["E501", "PLC0415"]
"src/experience_vector_db.py" = ["E501"]
"src/disaster_recovery/orchestrator.py" = ["E501"]
"src/api/rate_limiter.py" = ["E501"]
"src/api/marketplace_models.py" = ["E501"]
"src/api/analytics.py" = ["E501", "PLC0415", "RUF029"]
"src/api/websocket_manager.py" = ["E501", "PLC0415"]
"src/planning/preferences.py" = ["E501", "PLC0415"]
"src/planning/executor.py" = ["E501", "F821", "PLC0415"]
"src/planning/context_extractor.py" = ["E501", "PLC0415"]
# Lazy imports to avoid circular dependencies
"src/agent_execution/planning.py" = ["E501", "PLC0415"]
"src/api/user_models.py" = ["E501"]
"src/api/disaster_recovery.py" = ["ASYNC240", "E501", "PLC0415", "ARG001"]
# Documentation code examples
"docs/**/*.py" = ["D100", "D103", "F401", "ARG"]
# Retry patterns require try-except in loops
"src/agent_execution/auto_execution.py" = ["PERF203", "PLW0603"]
"src/agent_execution/bid_lock_manager.py" = ["PERF203"]
"src/agent_execution/bid_deduplication.py" = ["RUF029", "PERF203"]
# Lazy imports to avoid circular dependencies
"src/agent_execution/arena.py" = ["E501", "PLC0415"]
"src/agent_execution/auto_threshold.py" = ["PLC0415", "E501"]
"src/agent_execution/bid_lock_manager_factory.py" = ["PLC0415"]
"src/agent_execution/classifiers/task_classifier.py" = ["PLC0415"]
"src/agent_execution/task_router.py" = ["PLC0415", "D107", "PLR6301", "ARG002", "SIM102"]
"src/agent_execution/intelligent_router.py" = ["PLC0415"]
"src/agent_execution/redis_bid_lock_manager.py" = ["PLC0415"]
"src/websocket/models.py" = ["PLC0415"]
# API lazy imports for optional dependencies
"src/api/system.py" = ["PLC0415"]
"src/api/tasks.py" = ["PLC0415", "PLW0603", "RUF029"]
"src/api/payments.py" = ["PLC0415"]
# Market scanner lazy imports
# Utils lazy imports
"src/utils/health_check.py" = ["PLC0415"]
"src/utils/file_validator.py" = ["PLC0415"]
"src/utils/logging_alerting.py" = ["PLC0415"]
# Planning lazy imports
# Service lazy imports
"src/llm_service.py" = ["PLC0415", "PERF203"]
"src/disaster_recovery.py" = ["PLC0415"]
"src/llm_health_check.py" = ["PLC0415"]
# Additional lazy imports
"src/disaster_recovery/backup_manager.py" = ["PLC0415"]
"src/api/learning.py" = ["PLC0415"]
"src/api/auth.py" = ["PLC0415", "RUF029", "ARG001"]
"src/api/versioning.py" = ["PLC0415"]
"src/api/scheduler_endpoints.py" = ["PLC0415"]
"src/api/files.py" = ["PLC0415", "PLW0603", "D102"]
"src/agent_execution/virtual_wallet.py" = ["PLC0415"]
"src/agent_execution/data_viz.py" = ["PLC0415", "SIM102"]
"src/agent_execution/closed_loop_learning.py" = ["PLC0415"]
"src/agent_execution/cost_tracker.py" = ["PLC0415", "PLW0603"]
"src/agent_execution/confidence_tracker.py" = ["PLC0415"]
"src/utils/apm.py" = ["PLC0415"]
"src/fine_tuning/dataset_builder.py" = ["PLC0415"]
"src/fine_tuning/ab_testing.py" = ["PLC0415"]
"src/distillation/dataset_manager.py" = ["PLC0415"]
"src/distillation/data_collector.py" = ["PLC0415"]
# Singleton patterns use global statement
"src/utils/telemetry.py" = ["PLW0603"]
"src/websocket/manager.py" = ["E501", "PLC0415", "PLW0603", "PLW0602"]
# Interface implementations and base classes
"src/agent_execution/handlers/task_handlers.py" = ["PLC0415", "PLR6301", "ARG002"]
# Simulation engine has test-like code
"src/agent_execution/simulation_engine.py" = ["RUF029", "PLR6301"]
# Analytics background tasks
# Disaster recovery API has unused db arguments
# Rate limit middleware has interface methods
"src/api/rate_limit_middleware.py" = ["PLR6301"]
# Redis rate limiter has global statements, interface methods, and mutable class attributes
"src/utils/redis_rate_limiter.py" = ["PLW0603", "PLR6301", "RUF012", "PLW1508"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["fastapi", "uvicorn", "stripe", "openai", "pandas"]
combine-as-imports = true
force-sort-within-sections = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
# Group imports by type for better organization
force-wrap-aliases = true
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 80

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Test discovery configuration
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    # Suppress Pydantic v2 deprecation warnings from external dependencies (traceloop, etc)
    # These are from third-party libraries that haven't fully migrated to Pydantic v2
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
# Performance optimizations
addopts = "-ra -q"
testpaths = ["tests"]
log_cli = false
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/__main__.py",
    "src/client_portal/*",
]
branch = true
# Collect coverage from parallel test runs
parallel = true
# Include concurrency support
concurrency = ["thread", "multiprocessing"]
# Note: dynamic_context removed due to coverage.py compatibility issues

[tool.coverage.report]
exclude_lines = [
    # Standard exclude lines
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    
    # Abstract methods
    "@abstractmethod",
    "@abc.abstractmethod",
    
    # Protocol methods
    "if __name__ == .__main__.:",
    
    # Type checking imports
    "import TYPE_CHECKING",
    
    # Debug-only code
    "if DEBUG:",
    "if debug:",
    
    # Fallback imports
    "except ImportError:",
    
    # Platform-specific code
    "if sys.platform:",
    "if platform.system():",
    
    # Version-specific code
    "if sys.version_info",
    
    # Logging statements (hard to test)
    "logger\\.debug\\(",
    "logger\\.info\\(",
    
    # Docstrings
    '"""',
    "'''",
    
    # Pass statements
    "\\.\\.\\.",
    "pass",
]
fail_under = 80
show_missing = true
skip_covered = false
skip_empty = true
sort = "Miss"
# Show coverage by file
precision = 2
# Exclude specific files from coverage report
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Per-file coverage thresholds
[tool.coverage.paths]
source = [
    "src/",
    "*/site-packages/",
]

# Coverage thresholds by module (optional granular control)
[tool.coverage.html]
directory = "htmlcov"
title = "ArbitrageAI Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

# JSON report for CI/CD integration
[tool.coverage.json]
output = "coverage.json"

# Mypy type checking configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = true
warn_no_return = false
follow_imports = "normal"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
incremental = false
cache_dir = ".mypy_cache"
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
strict = false
allow_redefinition = true

# Disable pre-existing mypy error codes (Issue #245)
# These errors existed in the main branch before type checking was enabled
# New errors will still be caught - this allows PRs to not see pre-existing issues
disable_error_code = [
    "assignment",      # 185 errors - SQLAlchemy model attribute type mismatches
    "attr-defined",   # 126 errors - Optional attribute access issues
    "arg-type",       # 94 errors - Argument type mismatches
    "valid-type",     # 33 errors - Base class type issues (SQLAlchemy Base)
    "union-attr",     # 30 errors - Union type attribute access
    "misc",           # 26 errors - Various SQLAlchemy model issues
    "index",          # 23 errors - Index type issues
    "var-annotated", # 21 errors - Variable annotation issues
    "annotation-unchecked", # 18 errors - Annotation checking issues
    "operator",       # 14 errors - Operator type issues
    "no-redef",       # 12 errors - Redefinition issues
    "return-value",   # 11 errors - Return type mismatches
    "dict-item",      # 9 errors - Dict item type issues
    "call-arg",       # 7 errors - Call argument issues
    "name-defined",   # 6 errors - Name definition issues
    "override",       # 5 errors - Override method issues
    "unused-ignore", # 4 errors - Unused ignore comments
    "import-untyped", # 3 errors - Import untyped module issues
    "call-overload",  # 2 errors - Call overload issues
    "truthy-function", # 1 error - Truthy function issues
]

# Third-party packages without type stubs
[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
    "e2b_code_interpreter",
    "traceloop_sdk",
    "arize_phoenix",
    "chromadb",
    "sentence_transformers",
    "playwright",
    "stripe",
    "openai",
    "httpx",
    "docker",
    "redis",
    "pydantic",
    "pydantic_settings",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "psycopg2",
    "alembic",
    "celery",
    "billiard",
    "kombu",
    "prometheus_client",
    "opentelemetry",
    "opentelemetry.sdk",
    "opentelemetry.api",
    "opentelemetry.sdk.trace",
    "opentelemetry.sdk.metrics",
    "opentelemetry.exporter",
    "opentelemetry.instrumentation",
    "opentelemetry.trace",
    "opentelemetry.sdk.resources",
    "opentelemetry.semconv",
    "l10n",
    "playsound",
    "gitlab",
    "jira",
    "oauthlib",
    "requests_oauthlib",
    "authlib",
    "celery.canvas",
    "celery.result",
    "pytest",
    "pytest_asyncio",
    "pytest_httpx",
    "faker",
    "aiosqlite",
    "aioredis",
    "aioboto3",
    "moto",
    "boto3",
    "botocore",
    "mypy.api",
    "sklearn",
    "numpy",
    "pandas",
    "croniter",
    "pytz",
]

# Exclude directories that don't need type checking
[[tool.mypy.overrides]]
ignore_errors = true
module = [
    "tests.*",
    "alembic.*",
    "scripts.*",
    "refactor_models",
]



# =============================================================================
# Vulture - Dead Code Detection
# =============================================================================
[tool.vulture]
paths = ["src"]
min_confidence = 80
sort_by_size = true
exclude = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*/scripts/*",
    "*/alembic/versions/*",
]


# =============================================================================
# Flake8 - Code Quality (complements Ruff)
# =============================================================================
[tool.flake8]
max-line-length = 100
max-complexity = 12
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "*.egg-info",
    "build",
    "dist",
    "alembic/versions",
    "tests",
    "scripts",
]
ignore = [
    "E501",
    "W191",
    "E111",
    "E114",
    "E117",
]
per-file-ignores = [
    "tests/*:S101,E402,F401",
    "scripts/*:E402,F401",
]


