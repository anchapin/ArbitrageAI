[project]
name = "arbitrage-ai"
version = "0.1.0"
description = "ArbitrageAI Backend"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "stripe>=7.0.0",
    "openai>=1.0.0",
    "e2b-code-interpreter>=1.0.0",
    "python-dotenv>=1.0.0",
    # File parsing dependencies
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "PyPDF2>=3.0.0",
    "python-multipart>=0.0.6",
    # Experience Vector Database (RAG for Few-Shot Learning)
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    # Observability and Tracing
    "traceloop-sdk>=0.15.0",
    "arize-phoenix>=4.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    # APM and distributed tracing (Issue #42)
    "opentelemetry-exporter-prometheus>=0.45b0",
    "numpy>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-requests>=0.45b0",
    "prometheus-client>=0.19.0",
    # Docker Sandbox (replaces E2B for cost savings)
    "docker>=7.0.0",
    # Market Scanner (Playwright for web scraping)
    "playwright>=1.40.0",
    # Distributed Locking and Caching (Issue #19)
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "croniter>=2.0.0",
    "PyJWT>=2.8.0",
    "boto3>=1.34.0",
    "schedule>=1.2.0",
    "ruff",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
]
tests = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.0.0",
]

[project.scripts]
ft-cli = "fine_tuning.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Exclude specific directories
exclude = [
    ".agents/",
    ".venv/",
    "venv/",
    "src/client_portal/node_modules/",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (Python version upgrades)
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
    "E722",   # bare-except (explicitly included)
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "PLR0913",  # Too many arguments in function definition
    "PLR2004",  # Magic value used in comparison
    "PTH123",   # `open()` should be replaced by `Path.open()`
]

# Allow autofix for specific rules
fixable = ["ALL"]
unfixable = [
    "ERA",  # Don't auto-remove commented-out code (may be intentional)
]

# Per-file-ignores
[tool.ruff.lint.per-file-ignores]
# Tests can have magic values and assertions
"tests/**/*.py" = [
    "PLR2004",  # Magic values
    "S101",     # assert statements
    "ARG",      # Unused arguments (fixtures)
]
# Fine-tuning CLI can have simple code
"src/fine_tuning/**/*.py" = ["T201"]
# Ignore commented-out code in config files
"pyproject.toml" = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["fastapi", "uvicorn", "stripe", "openai", "pandas"]
combine-as-imports = true
force-sort-within-sections = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 80

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Suppress Pydantic v2 deprecation warnings from external dependencies (traceloop, etc)
    # These are from third-party libraries that haven't fully migrated to Pydantic v2
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
# Performance optimizations
addopts = "-ra -q"
testpaths = ["tests"]
log_cli = false
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 80
show_missing = true

