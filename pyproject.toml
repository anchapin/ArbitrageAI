[project]
name = "arbitrage-ai"
version = "0.1.0"
description = "ArbitrageAI Backend"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "stripe>=7.0.0",
    "openai>=1.0.0",
    "e2b-code-interpreter>=1.0.0",
    "python-dotenv>=1.0.0",
    # File parsing dependencies
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "PyPDF2>=3.0.0",
    "python-multipart>=0.0.6",
    # Experience Vector Database (RAG for Few-Shot Learning)
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    # Observability and Tracing
    "traceloop-sdk>=0.15.0",
    "arize-phoenix>=4.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    # APM and distributed tracing (Issue #42)
    "opentelemetry-exporter-prometheus>=0.45b0",
    "numpy>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-requests>=0.45b0",
    "prometheus-client>=0.19.0",
    # Docker Sandbox (replaces E2B for cost savings)
    "docker>=7.0.0",
    # Market Scanner (Playwright for web scraping)
    "playwright>=1.40.0",
    # Distributed Locking and Caching (Issue #19)
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "croniter>=2.0.0",
    "PyJWT>=2.8.0",
    "boto3>=1.34.0",
    "schedule>=1.2.0",
    "ruff",
    # Database migrations (QAQC-008)
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
    "pre-commit>=3.6.0",
]
tests = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.0.0",
]

[project.scripts]
ft-cli = "fine_tuning.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Exclude specific directories
exclude = [
    ".agents/",
    ".git/",
    ".venv/",
    "venv/",
    "__pycache__/",
    "node_modules/",
    "src/client_portal/node_modules/",
    "*.egg-info/",
    ".eggs/",
    "dist/",
    "build/",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enable comprehensive linting rules for maximum code consistency
select = [
    # Core linting
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    
    # Bug prevention
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie (additional bugbear rules)
    "RUF",    # Ruff-specific rules
    
    # Code quality & style
    "N",      # pep8-naming
    "Q",      # flake8-quotes
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "COM",    # flake8-commas (trailing commas)
    "PYI",    # flake8-pyi (type stub files)
    
    # Modernization
    "UP",     # pyupgrade (Python version upgrades)
    "PERF",   # flake8-perflint (performance anti-patterns)
    
    # Async & concurrency
    "ASYNC",  # flake8-async
    
    # Type checking
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "FA",     # flake8-future-annotations
    
    # Pathlib & modernization
    "PTH",    # flake8-use-pathlib
    
    # Code cleanliness
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "ISC",    # flake8-implicit-str-concat
    "INP",    # flake8-no-pep420 (implicit namespace packages)
    "TID",    # flake8-tidy-imports
    "ICN",    # flake8-import-conventions
    
    # Security
    "S",      # flake8-bandit (security)
    "DJ",     # flake8-django (security patterns)
    
    # Datetime safety
    "DTZ",    # flake8-datetimez (datetime safety)
    
    # Documentation
    "D",      # pydocstyle (docstring conventions)
    "D213",   # Multi-line docstring summary should start at the second line
    "D417",   # Missing argument descriptions in docstrings
    
    # Explicitly include important rules
    "E722",   # bare-except
]

ignore = [
    # Formatting rules (handled by ruff format)
    "E501",     # line too long (handled by formatter)
    "W191",     # indentation contains tab
    "E111",     # indentation with invalid multiple
    "E114",     # indentation is over-indented
    "E117",     # over-indented
    
    # Pylint rules that are too strict
    "PLR0913",  # Too many arguments in function definition
    "PLR2004",  # Magic value used in comparison
    "PLR0912",  # Too many branches (handled by mccabe)
    "PLR0915",  # Too many statements (handled by mccabe)
    
    # Pathlib rules that are too aggressive
    "PTH123",   # `open()` should be replaced by `Path.open()`
    
    # Test-related exclusions (handled in per-file-ignores)
    "S101",     # assert statements (allowed in tests)
    
    # Datetime rules for logging
    "DTZ005",   # datetime.now() without tz (acceptable for logs)
    
    # Docstring rules that are too strict
    "D100",     # Missing docstring in public module
    "D104",     # Missing docstring in public package
    "D105",     # Missing docstring in magic method
    "D203",     # 1 blank line required before class docstring (conflicts with D211)
    "D212",     # Multi-line docstring summary should start at first line (use D213 instead)
    
    # Import rules that conflict with project structure
    "INP001",   # File is part of an implicit namespace package
]

# Allow autofix for specific rules
fixable = ["ALL"]
unfixable = [
    "ERA",  # Don't auto-remove commented-out code (may be intentional)
]

# Preview mode for latest rules
preview = true

# Per-file-ignores
[tool.ruff.lint.per-file-ignores]
# Tests can have magic values and assertions
"tests/**/*.py" = [
    "PLR2004",  # Magic values
    "S101",     # assert statements
    "ARG",      # Unused arguments (fixtures)
    "DTZ",      # Datetime rules (test data)
    "S105",     # Hardcoded passwords (test data)
    "S106",     # Hardcoded passwords (test data)
    "S110",     # try-except-pass (test error handling)
    "B017",     # assert-raises-exception (test patterns)
    "B011",     # assert-false (test patterns)
    "D",        # Docstring requirements
    "N806",     # Non-lowercase variable names (test data)
    "PERF",     # Performance rules (test data)
    "INP001",   # Implicit namespace package
]
# Fine-tuning CLI can have simple code
"src/fine_tuning/**/*.py" = ["T201"]
# Ignore commented-out code in config files
"pyproject.toml" = ["ALL"]
# __init__.py files can have unused imports (for re-exporting)
"**/__init__.py" = ["F401", "F403", "D104"]
# Conftest can have unused fixtures and imports
"**/conftest.py" = ["F401", "F403", "ARG", "D100", "D103"]
# Scripts can use print statements
"scripts/**/*.py" = ["T201", "INP001"]
# Migrations can have magic values and raw SQL
"**/migrations/**/*.py" = ["PLR2004", "S608", "D100"]
# Examples and demos can have relaxed rules
"examples/**/*.py" = ["D100", "D103", "PLR2004", "S101"]
# Documentation code examples
"docs/**/*.py" = ["D100", "D103", "F401", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["fastapi", "uvicorn", "stripe", "openai", "pandas"]
combine-as-imports = true
force-sort-within-sections = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
# Group imports by type for better organization
force-wrap-aliases = true
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 80

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Test discovery configuration
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    # Suppress Pydantic v2 deprecation warnings from external dependencies (traceloop, etc)
    # These are from third-party libraries that haven't fully migrated to Pydantic v2
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
# Performance optimizations
addopts = "-ra -q"
testpaths = ["tests"]
log_cli = false
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/__main__.py",
    "src/client_portal/*",
]
branch = true
# Collect coverage from parallel test runs
parallel = true
# Include concurrency support
concurrency = ["thread", "multiprocessing"]
# Measure coverage in real-time
dynamic_context = "thread"

[tool.coverage.report]
exclude_lines = [
    # Standard exclude lines
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    
    # Abstract methods
    "@abstractmethod",
    "@abc.abstractmethod",
    
    # Protocol methods
    "if __name__ == .__main__.:",
    
    # Type checking imports
    "import TYPE_CHECKING",
    
    # Debug-only code
    "if DEBUG:",
    "if debug:",
    
    # Fallback imports
    "except ImportError:",
    
    # Platform-specific code
    "if sys.platform:",
    "if platform.system():",
    
    # Version-specific code
    "if sys.version_info",
    
    # Logging statements (hard to test)
    "logger\\.debug\\(",
    "logger\\.info\\(",
    
    # Docstrings
    '"""',
    "'''",
    
    # Pass statements
    "\\.\\.\\.",
    "pass",
]
fail_under = 80
show_missing = true
skip_covered = false
skip_empty = true
sort = "Miss"
# Show coverage by file
precision = 2
# Exclude specific files from coverage report
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Per-file coverage thresholds
[tool.coverage.paths]
source = [
    "src/",
    "*/site-packages/",
]

# Coverage thresholds by module (optional granular control)
[tool.coverage.html]
directory = "htmlcov"
title = "ArbitrageAI Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

# JSON report for CI/CD integration
[tool.coverage.json]
output = "coverage.json"

